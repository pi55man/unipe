socket_path = "/tmp/unipe.sock"
# the exporter tick, in ms. this is the detection latency budget.
interval_hint_ms = 250

[detector]
# drop anything the pipeline is not at least half sure about
min_confidence = 0.5
# same flood/scan victim must not re-alert every exporter tick (~250ms)
alert_cooldown_s = 60.0

[volumetric]
min_unique_sources = 30
dst_packet_rate = 5000.0
dst_byte_rate = 2000000.0
flow_packet_rate = 5000.0
flow_byte_rate = 2000000.0
flow_min_duration_ms = 500.0
flow_min_packets = 100.0
syn_flood_min_flows = 20
syn_flood_min_syn_ratio = 5.0
syn_only_fraction = 0.7
udp_flood_min_flows = 25
udp_flood_packet_rate = 5000.0
udp_flood_max_avg_packets = 3.0
icmp_flood_min_flows = 25
icmp_flood_packet_rate = 1000.0
# Only mutes the generic fan-in alert on RFC1918/multicast destinations.
# SYN/UDP/ICMP flood signatures always run.
alert_lan_destinations = false

[spoofing]
ttl_variance_min_values = 3
ttl_min_families = 3
spoofed_syn_min_sources = 20
spoofed_syn_min_flows = 20
spoofed_syn_only_fraction = 0.8
# Keep false on laptop/Wi-Fi taps. Set true only on edge/ISP unidirectional spans.
alert_private_to_public = false

[beaconing]
min_intervals = 5
max_jitter_ratio = 0.15
# browsers keepalive on 80/443/853; demand a longer, cleaner metronome there
# 8080 stays on the normal threshold — implants love that port
web_min_intervals = 8
web_max_jitter_ratio = 0.08
min_interval_s = 1.0
max_interval_s = 3600.0
# Gates on the busiest window, not the average: a beacon is small every single
# time, whereas a keepalive is small only after its page finished loading.
max_bytes_per_window = 8192.0
history = 24
alert_cooldown_s = 300.0
idle_evict_s = 7200.0
# Both halves of a conversation fold onto one key, so this works whether the
# tap carries one direction or both. C2 itself must be off-network.
external_only = true
# Same host waking many peers on the same period is BitTorrent/P2P, not C2.
swarm_min_peers = 3
swarm_interval_slack = 0.25
ignore_p2p_ports = true

[dns]
# trained dns_model.json threshold; signal vote is only the no-model fallback
dga_model_threshold = 0.55
# A label must trip this many of the four randomness signals to count as DGA
# when the trained model artifact is missing.
dga_min_signals = 3
dga_max_bigram_familiarity = 0.35
dga_min_normalized_entropy = 0.90
dga_max_vowel_ratio = 0.25
dga_min_digit_ratio = 0.15
# An all-digit label (a Discord snowflake, a timestamp, a shard id) has no
# vowels and no letter pairs for the trivial reason that it has no letters.
dga_min_letters = 6
dga_min_label_len = 10
dga_max_label_len = 40
# CDNs generate random hostnames on purpose, so randomness proves nothing there.
dga_ignore_parents = [
  "cloudfront.net", "akamaiedge.net", "akamai.net", "akadns.net",
  "azureedge.net", "trafficmanager.net", "amazonaws.com",
  "googleusercontent.com", "1e100.net", "fastly-edge.com",
  "fbcdn.net", "windowsupdate.com", "github.com", "githubusercontent.com",
  "microsoft.com", "office.com", "google.com", "gstatic.com", "cloudflare.com",
  "mozilla.net", "mozilla.org", "mozilla.com", "mozgcp.net", "mozaws.net",
]
tunnel_min_qname_len = 60
tunnel_min_label_count = 4
tunnel_min_entropy = 3.2
tunnel_min_subdomains = 15
max_reasonable_qname_len = 100

[encrypted]
# Checked against both ends of the flow, since the reply direction has the
# service port as its source.
alert_nonstandard_port = true
alert_missing_sni = true
# JA3 md5 hashes of known-bad clients, e.g. from abuse.ch SSLBL.
ja3_blocklist = []

[scanning]
min_ports_per_dst = 20
min_dsts_per_port = 20
max_avg_packets = 5.0
min_syn_only_fraction = 0.7
# Ignore high ephemeral ports so RX-only return traffic is not a "scan".
max_scan_dst_port = 10000

[exfiltration]
min_outbound_bytes = 5000000.0
min_ratio = 10.0
min_duration_ms = 1000.0
require_internal_source = true
# An unseen reverse direction is normal on a one-way span, so don't infer from it.
require_reverse_flow = true
