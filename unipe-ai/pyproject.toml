[project]
name = "unipe-ai"
version = "0.1.0"
description = "Python IDS engine that consumes unidirectional flow records from unipe over a Unix socket."
requires-python = ">=3.11"
# no runtime dependencies on purpose: the model is plain python
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
unipe-ai = "unipe_ai:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["unipe_ai*"]
